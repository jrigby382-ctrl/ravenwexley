<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven Wexley</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a001f, #001f3d);
            color: white;
            text-align: center;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-pic {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-bottom: 5px solid #c026d3;
        }
        h1 {
            margin: 20px 0 8px;
            font-size: 32px;
            text-shadow: 0 0 15px #c026d3;
        }
        .verified {
            background: #22c55e;
            color: black;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 9999px;
            display: inline-block;
        }
        p {
            opacity: 0.9;
            line-height: 1.6;
            margin: 16px 0 30px;
        }
        .big-btn {
            display: block;
            background: linear-gradient(90deg, #c026d3, #3b82f6);
            color: white;
            padding: 25px 20px;
            margin: 25px auto;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 35px #c026d3;
            position: relative;
            overflow: hidden;
        }
        .btn-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 12px;
        }
        .btn-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- BIG PROFILE PICTURE -->
        <img src="https://i.imgur.com/03X3qJu.jpeg" alt="Raven Wexley" class="profile-pic">
        
        <h1>Raven Wexley <span class="verified">✓</span></h1>
        <p>20 • Alt e-girl & digital creator 🖤</p>
        
        <!-- BIG FANVUE BUTTON WITH PICTURE -->
        <a href="https://fanvue.com/ravenwexley" class="big-btn">
            <img src="https://i.imgur.com/MjK6VSp.jpeg" class="btn-image" alt="Raven">
            <div class="btn-text">free exclusive ;)</div>
        </a>
        
        <!-- Instagram Button -->
        <a href="https://instagram.com/ravenwexley" class="big-btn">Instagram</a>
        
        <!-- Threads Button -->
        <a href="https://www.threads.com/@ravenwexley" class="big-btn">Threads</a>
        
        <!-- Bottom 3 Pictures Area -->
        <div style="margin-top: 40px; display: flex; justify-content: center; gap: 10px;">
            <img src="https://i.imgur.com/I8NKZg3.jpeg" style="width: 30%; border-radius: 12px;" alt="Raven">
            <img src="https://i.imgur.com/BAgEZXs.jpeg" style="width: 30%; border-radius: 12px;" alt="Raven">
            <img src="https://i.imgur.com/CN7TYjG.jpeg" style="width: 30%; border-radius: 12px;" alt="Raven">
        </div>
    </div>
</body>
</html>
